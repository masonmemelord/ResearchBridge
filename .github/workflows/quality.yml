name: Quality and local Auth security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_ENABLE_SELF_SIGNUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint, types, unit tests, runtime audit and production build
        run: npm run release:check
        working-directory: frontend
      - uses: supabase/setup-cli@v3
        with:
          version: "2.104.0"
      - name: Database and real Auth regressions (local services only)
        run: npm run test:auth:integration -- --manage-local --database-checks
        working-directory: frontend
